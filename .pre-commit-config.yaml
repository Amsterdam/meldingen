repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruffcheck
        name: Ruff Check
        description: This hook runs Ruff through uv
        entry: uv run ruff check .
        language: system
        always_run: true
        pass_filenames: false
      - id: ruffformat
        name: Ruff Format
        description: This hook runs Ruff through uv
        entry: uv run ruff format --check .
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: MyPy
        description: This hook runs MyPy through uv
        entry: bash -c 'uv run mypy --strict . | uv run mypy-baseline filter'
        language: system
        always_run: true
        pass_filenames: false
