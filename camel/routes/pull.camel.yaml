- rest:
    get:
      - path: "/meldingen"
        produces: "application/json"
        param:
          - name: state
            type: "query"
            description: "Optional comma-separated list of melding states to pass through to the upstream API, for example processing,completed."
        to: "direct:camel-protected-api-pull-endpoint"

- route:
    id: fetch-meldingen
    from:
      uri: direct:fetch-meldingen
      steps:
        - to:
            uri: direct:request-oidc-token # TODO clients need to do it themselves, remove later.
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} >= 400"
                steps:
                  - log:
                      message: "Pull auth failed with status=${header.CamelHttpResponseCode} using grant_type=${exchangeProperty.oidcGrantType}"
                      loggingLevel: WARN
            otherwise:
              steps:
                - unmarshal:
                    json: {}
                - setHeader:
                    name: Authorization
                    simple: "Bearer ${body[access_token]}"
                - setHeader:
                    name: Accept
                    constant: application/json
                - removeHeaders:
                    pattern: CamelHttp*
                - setHeader:
                    name: CamelHttpMethod
                    constant: GET
                - choice:
                    when:
                      - simple: "${header.state} != null && ${header.state} != ''"
                        steps:
                          - setHeader:
                              name: CamelHttpQuery
                              simple: "state=${header.state}"
                - setBody:
                    constant: ""
                - removeHeaders:
                    pattern: Content-Type|state
                - to:
                    uri: "{{env:CAMEL_API_URL}}/melding/"
                    parameters:
                      bridgeEndpoint: true
                      throwExceptionOnFailure: false
                - removeHeaders:
                    pattern: Authorization|Accept|CamelHttp*
                - log:
                    message: "Pulled protected API with status=${header.CamelHttpResponseCode} from {{env:CAMEL_API_URL}}/melding"
                    loggingLevel: INFO

- route:
    id: camel-protected-api-pull-endpoint
    from:
      uri: direct:camel-protected-api-pull-endpoint
      steps:
        - to:
            uri: direct:fetch-meldingen
        - setHeader:
            name: Cache-Control
            constant: no-store
        - setHeader:
            name: Pragma
            constant: no-cache