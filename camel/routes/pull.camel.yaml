- route:
    id: camel-protected-api-pull-endpoint
    from:
      uri: undertow:http://0.0.0.0:{{env:CAMEL_HTTP_PORT}}/meldingen
      parameters:
        httpMethodRestrict: GET
      steps:
        - to:
            uri: direct:request-oidc-token  # TODO nu voor testen, maar later verwijderen
        - setHeader:
            name: Cache-Control
            constant: no-store
        - setHeader:
            name: Pragma
            constant: no-cache
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} >= 400"
                steps:
                  - log:
                      message: "Pull auth failed with status=${header.CamelHttpResponseCode} using grant_type=${exchangeProperty.oidcGrantType}"
                      loggingLevel: WARN
            otherwise:
              steps:
                - unmarshal:
                    json: {}
                - setHeader:
                    name: Authorization
                    simple: "Bearer ${body[access_token]}"
                - setHeader:
                    name: Accept
                    constant: application/json
                - setHeader:
                    name: CamelHttpMethod
                    constant: GET
                - setBody:
                    constant: ""
                - removeHeader:
                    name: Content-Type
                - to:
                    uri: "{{env:CAMEL_API_URL}}/melding/"
                    parameters:
                      bridgeEndpoint: true
                      throwExceptionOnFailure: false
                - log:
                    message: "Pulled protected API with status=${header.CamelHttpResponseCode} from {{env:CAMEL_API_URL}}/melding"
                    loggingLevel: INFO